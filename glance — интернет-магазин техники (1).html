<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>glance — интернет-магазин техники</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f6;--surface:#fff;--text:#0c0c0c;--muted:#454545;--old:#6f6f6f;--field:#dedede;--tile:#d2d7fa;--img:#d9d9d9;--blue:#091d9e;--yellow:#ebba1a;--green:#169b00;--hdr:rgba(246,246,246,.92);--blend:multiply;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101015;--surface:#1b1b23;--text:#f2f2f2;--muted:#b5b5c0;--old:#9a9aa5;--field:#2a2a35;--tile:#2b2f55;--img:#2a2a35;--blue:#5b6cff;--green:#3ccf1f;--hdr:rgba(16,16,21,.92);--blend:normal}}
:root[data-theme="dark"]{--bg:#101015;--surface:#1b1b23;--text:#f2f2f2;--muted:#b5b5c0;--old:#9a9aa5;--field:#2a2a35;--tile:#2b2f55;--img:#2a2a35;--blue:#5b6cff;--green:#3ccf1f;--hdr:rgba(16,16,21,.92);--blend:normal}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:300 16px/1.3 Roboto,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(8px)}
.hd{display:grid;grid-template-columns:1fr;gap:16px;padding:20px 0 12px;justify-items:center}
.logo{font-size:28px;font-weight:400;background:linear-gradient(90deg,var(--blue),#750dc5);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{width:100%;display:flex;gap:16px;align-items:center;background:var(--field);border-radius:8px;padding:0 16px;height:47px;color:var(--muted);font-weight:400}
.tabs{display:none;gap:32px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--blue)}
.badge{position:absolute;top:-6px;right:6px;background:var(--blue);color:#fff;border-radius:99px;font-size:11px;min-width:16px;padding:1px 4px;text-align:center;display:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
main{display:flex;flex-direction:column;gap:32px;padding:16px 0 120px}
h2{font-weight:400;font-size:20px;margin-bottom:20px}
.banner{position:relative;display:flex;align-items:center;justify-content:space-between;overflow:hidden;background:#0c0c0c;color:#fff;border-radius:8px;min-height:149px;padding:20px 20px 20px 24px;gap:12px}
.banner h1{font-weight:400;font-size:20px;margin-bottom:8px}.banner p{font-size:14px;max-width:16em}
.banner img{height:170px;width:auto;margin:-10px -10px -30px 0;mix-blend-mode:screen;opacity:.95}
.arr{display:none;position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:#ffffffd9;color:#0c0c0c;font-size:22px}
.l{left:24px}.r{right:24px}
.cats{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.cat{flex:0 0 98px;scroll-snap-align:start;text-align:center;font-size:16px;display:flex;flex-direction:column;gap:12px}
.cat div{height:128px;border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.cat img{max-width:84%;max-height:84%;mix-blend-mode:var(--blend)}
.prods{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.card{flex:0 0 min(62vw,230px);scroll-snap-align:start;background:var(--surface);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.ph{height:150px;background:var(--img);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.ph img{max-height:86%;max-width:80%;mix-blend-mode:var(--blend)}
.dc{position:absolute;top:16px;right:16px;background:var(--yellow);color:#0c0c0c;border-radius:8px;padding:6px 8px;font-size:14px;font-weight:400}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%}
.nm{font-weight:400;font-size:16px;min-height:4.0em}
.pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pr b{font-weight:500;font-size:18px}.pr s{font-size:14px;color:var(--old)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--green)}
.fav{width:40px;height:40px;border-radius:8px;background:var(--field);display:grid;place-items:center}
.fav svg{width:20px;fill:none;stroke:var(--muted);stroke-width:2}.fav.on svg{fill:#e11;stroke:#e11}
.buy{background:var(--blue);color:#fff;border-radius:8px;height:44px;font-weight:500;font-size:14px}
@media (min-width:700px){
 .wrap{padding:0 32px}.cats,.prods{margin:0 -32px;padding:0 32px}
 .cats{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}.cat{flex:none}.cat div{height:190px}
 .prods{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}.card{flex:none}.ph{height:210px}
 h2{font-size:26px}.banner{min-height:200px;padding:32px 56px}.banner h1{font-size:32px}.banner p{font-size:20px}.banner img{height:250px}
}
@media (min-width:1100px){
 .hd{grid-template-columns:auto 1fr auto;gap:88px;padding:17px 0;justify-items:stretch;align-items:center}
 .search{height:40px}.tabs{display:flex}.bar{display:none}main{padding:24px 0 64px;gap:40px}
 h2{font-size:32px;margin-bottom:28px}.cats{grid-template-columns:repeat(6,1fr)}
 .prods{grid-template-columns:repeat(6,1fr)}.card{padding:20px 16px}.nm{font-size:16px}
 .banner{min-height:260px;padding:32px 120px 32px 241px;justify-content:flex-start;gap:80px}
 .banner h1{font-size:40px;margin-bottom:20px}.banner p{font-size:32px;max-width:434px}
 .banner img{height:330px;margin:0;position:absolute;right:230px;top:-30px}.arr{display:block}
}
</style></head><body>
